<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول لوحة التحكم — ليوان أرُب</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="shell" style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <div class="card" style="max-width:380px; width:100%;">
    <div style="text-align:center; margin-bottom:20px;">
      <img src="../assets/img/logo.png" alt="ليوان أرُب" style="height:34px; margin:0 auto 16px;">
      <h2 data-i18n="admin_login_title" style="margin:0;">دخول لوحة التحكم</h2>
    </div>
    <div id="login-alert"></div>
    <label class="field-label" data-i18n="label_email">البريد الإلكتروني</label>
    <input class="input" type="email" id="admin-email" style="margin-bottom:14px;">
    <label class="field-label" data-i18n="label_password">كلمة المرور</label>
    <input class="input" type="password" id="admin-password" style="margin-bottom:20px;">
    <button class="btn btn-primary" id="login-btn" style="width:100%;" data-i18n="btn_login">دخول</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/i18n.js"></script>
<script>
document.getElementById("login-btn").addEventListener("click", async ()=>{
  const email = document.getElementById("admin-email").value.trim();
  const password = document.getElementById("admin-password").value;
  const alertBox = document.getElementById("login-alert");
  alertBox.innerHTML = "";
  try{
    await apiAdminLogin(email, password);
    location.href = "dashboard.html?lang=" + getLang();
  }catch(e){
    alertBox.innerHTML = `<div class="alert alert-error">${t('login_error')}</div>`;
  }
});
</script>
</body>
</html>
